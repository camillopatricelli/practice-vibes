name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The CI run number is the build number shown in About and in the log (no commit hash in the app).
env:
  PV_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows -DPV_BUILD_NUMBER=${{ env.PV_BUILD_NUMBER }}

      - name: Build
        run: cmake --build --preset windows-release

      - name: Run DSP tests
        run: '& "build/windows/PracticeVibesTests_artefacts/Release/PracticeVibesTests.exe"'

      - name: Package
        shell: pwsh
        run: |
          $dir = "build/windows/PracticeVibes_artefacts/Release"
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "$dir/THIRD_PARTY_NOTICES.md"
          # Only the app and its notices go out: no debug symbols or linker leftovers.
          $unwanted = Get-ChildItem $dir -Recurse -File -Include *.pdb, *.ilk, *.exp, *.lib, *.obj
          if ($unwanted) { $unwanted | ForEach-Object { Write-Error "Unexpected file in the package: $($_.Name)" }; exit 1 }
          Get-ChildItem $dir -Recurse -File | ForEach-Object { $_.Name }
          Compress-Archive -Path "$dir/*" -DestinationPath PracticeVibes-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PracticeVibes-windows
          path: PracticeVibes-windows.zip
          retention-days: 3

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset ios -DPV_BUILD_NUMBER=${{ env.PV_BUILD_NUMBER }}

      # Built unsigned, then ad-hoc signed with the entitlements when packaged: SideStore signs the app with
      # the user's own Apple ID on install.
      - name: Build
        run: |
          cmake --build build/ios --config Release --target PracticeVibes -- \
            -sdk iphoneos -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH="$(find build/ios/PracticeVibes_artefacts -type d -name '*.app' | head -n 1)"
          echo "App bundle: $APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Ad-hoc sign with JUCE's generated entitlements: SideStore re-signs with the entitlements it finds
          # in the app, and an unsigned build has none. "inter-app-audio" is what lets an iOS app see
          # third-party AUv3 plug-ins (without it only Apple's built-in Audio Units are listed).
          ENTITLEMENTS="$(find build/ios -name 'PracticeVibes.entitlements' | head -n 1)"
          echo "Entitlements: $ENTITLEMENTS"
          test -n "$ENTITLEMENTS"
          cat "$ENTITLEMENTS"
          grep -q "inter-app-audio" "$ENTITLEMENTS"
          APP_IN_PAYLOAD="Payload/$(basename "$APP_PATH")"
          codesign --force --sign - --timestamp=none --entitlements "$ENTITLEMENTS" "$APP_IN_PAYLOAD"
          codesign -d --entitlements - "$APP_IN_PAYLOAD"

          zip -qry PracticeVibes.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PracticeVibes-ios
          path: PracticeVibes.ipa
          retention-days: 3

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset macos -DPV_BUILD_NUMBER=${{ env.PV_BUILD_NUMBER }}

      # Universal (arm64 + x86_64). Built unsigned, then ad-hoc signed as a whole once the bundle is complete.
      - name: Build
        run: |
          cmake --build --preset macos-release --target PracticeVibes PracticeVibesTests -- \
            -quiet CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Run DSP tests
        run: build/macos/PracticeVibesTests_artefacts/Release/PracticeVibesTests

      # No paid Apple account: no notarisation. Ad-hoc signature (Apple Silicon refuses unsigned code), no sandbox
      # and no hardened runtime, which would stop third-party plugins from loading. Testers follow READ ME FIRST.txt.
      - name: Sign and package DMG
        run: |
          APP="build/macos/PracticeVibes_artefacts/Release/Practice Vibes.app"
          test -d "$APP"
          lipo -info "$APP/Contents/MacOS/Practice Vibes"
          lipo -info "$APP/Contents/Frameworks/libonnxruntime.dylib"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          cp "Resources/macOS/READ ME FIRST.txt" dmg/
          cp LICENSE dmg/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md dmg/
          if find dmg -name '*.dSYM' | grep -q .; then echo "Unexpected debug symbols in the dmg"; exit 1; fi

          # hdiutil sometimes fails with "Resource busy" on CI runners: retry a few times.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "Practice Vibes" -srcfolder dmg -ov -format UDZO PracticeVibes-macos.dmg && break
            echo "hdiutil failed (attempt $attempt), retrying"
            sleep 10
          done
          test -f PracticeVibes-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PracticeVibes-macos
          path: PracticeVibes-macos.dmg
          retention-days: 3

  # Every push to main refreshes the "latest-build" pre-release in place, so the .ipa can be downloaded straight
  # from Safari on the iPad. The tag moves to the new commit and the files of this run replace the old ones.
  # The macOS build is optional here: if it fails, the Windows and iPad builds are still published and the
  # previous .dmg stays (the notes say so).
  publish:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.windows.result == 'success' && needs.ios.result == 'success'
    needs: [windows, ios, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Update the latest-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FILES="PracticeVibes.ipa PracticeVibes-windows.zip"
          NOTES="Automatic test build ${PV_BUILD_NUMBER} (shown in the app under About). Not a stable release.
          Free software under the GNU AGPLv3: the source of this build is this tag."
          if [ -f PracticeVibes-macos.dmg ]; then
            FILES="$FILES PracticeVibes-macos.dmg"
          elif gh release view latest-build --json assets --jq '.assets[].name' 2> /dev/null | grep -q '^PracticeVibes-macos.dmg$'; then
            NOTES="$NOTES
          The macOS file is from an earlier build: the macOS job failed this time."
          else
            NOTES="$NOTES
          No macOS file this time: the macOS job failed."
          fi

          if gh release view latest-build > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest-build" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit latest-build --prerelease --title "Latest build" --notes "$NOTES"
            gh release upload latest-build $FILES --clobber
          else
            gh release create latest-build --prerelease --target "$GITHUB_SHA" --title "Latest build" --notes "$NOTES" $FILES
          fi
